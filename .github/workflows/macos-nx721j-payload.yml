name: NX721J XNU first-entry diagnostic payload

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: Successful NX721J first-entry kernel workflow run ID
        required: true
      kernel_artifact_name:
        description: Kernel artifact name from that run
        required: true
      dram_base:
        description: First verified contiguous DRAM bank base
        required: true
        default: "0x80000000"
      dram_size:
        description: First verified contiguous DRAM bank size
        required: true
        default: "0x80000000"

permissions:
  actions: read
  contents: read

jobs:
  payload:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout NX721J device repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install payload and probe tools
        run: |
          brew install mtools llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          test -x "$(brew --prefix lld)/bin/ld.lld"
          "$(brew --prefix lld)/bin/ld.lld" --version

      - name: Download successful kernel artifact
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_RUN_ID: ${{ inputs.kernel_run_id }}
          KERNEL_ARTIFACT_NAME: ${{ inputs.kernel_artifact_name }}
        run: |
          mkdir -p input/kernel
          gh run download "$KERNEL_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$KERNEL_ARTIFACT_NAME" \
            --dir input/kernel
          KERNEL_PATH="$(find input/kernel -type f -name kernel.macho -print -quit)"
          test -n "$KERNEL_PATH"
          printf 'KERNEL_PATH=%s\n' "$KERNEL_PATH" >> "$GITHUB_ENV"

      - name: Verify artifact and generate NX721J ADT
        env:
          DRAM_BASE: ${{ inputs.dram_base }}
          DRAM_SIZE: ${{ inputs.dram_size }}
        run: |
          python3 scripts/test-nx721j-payload-validation.py
          python3 -m py_compile \
            scripts/make-nx721j-adt.py \
            scripts/build-nx721j-payload.py
          mkdir -p out/nx721j
          python3 scripts/make-nx721j-adt.py \
            --output out/nx721j/kernel.macho.adt \
            --report out/nx721j/adt.json \
            --dram-base "$DRAM_BASE" \
            --dram-size "$DRAM_SIZE" \
            --arm-io-base 0x1000000 \
            --arm-io-size 0x20000000 \
            --cpu-regs 0 \
            --psci-method smc

      - name: Patch an isolated kernel copy with entry diagnostics
        run: |
          mkdir -p out/nx721j
          cp "$KERNEL_PATH" out/nx721j/kernel.entry-probe.macho
          shasum -a 256 "$KERNEL_PATH" out/nx721j/kernel.entry-probe.macho
          python3 scripts/patch-xnu-entry-probe.py \
            out/nx721j/kernel.entry-probe.macho \
            --reset-delay 6
          shasum -a 256 "$KERNEL_PATH" out/nx721j/kernel.entry-probe.macho

      - name: Build NX721J first-entry payload without storage arguments
        run: |
          python3 scripts/build-nx721j-payload.py \
            --kernel out/nx721j/kernel.entry-probe.macho \
            --adt out/nx721j/kernel.macho.adt \
            --output out/nx721j/nx721j-xnu-first-entry.img \
            --title "NX721J XNU entry and MMU diagnostic (no UFS)" \
            --timeout 3 \
            --size-mib 192 \
            --volume-label NX721J

      - name: Upload payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nx721j-xnu-first-entry-${{ github.run_number }}
          path: out/nx721j/**
          if-no-files-found: error
          retention-days: 7
